name: sync-profile-stats

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read public repo count
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api users/hayyanjpg --jq .public_repos)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          REPO_COUNT: ${{ steps.stats.outputs.count }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          data = path.read_bytes()
          count = os.environ["REPO_COUNT"].encode()

          updated = re.sub(rb"Public%20Repos-\d+-00E5FF", b"Public%20Repos-" + count + b"-00E5FF", data)
          updated = re.sub(rb";\d+\+public\+repos", b";" + count + b"+public+repos", updated)

          if updated != data:
              path.write_bytes(updated)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "sync profile repo count"
            git push
          fi
